# Settings of Brew GUI for the mac-app-kit scripts in scripts/ (zsh syntax; defaults in scripts/app-config.sh).
APP_NAME="Brew GUI"
EXECUTABLE="BrewGUI"
BUNDLE_ID="io.github.furcenzo.brewgui"
GITHUB_REPO="Furcenzo/brew-gui"
CASK="brew-gui"                          # Casks/brew-gui.rb in Furcenzo/homebrew-tap
SITE_SLUG="brew-gui"                     # dev.furian.sk
CATEGORY="public.app-category.developer-tools"
MIN_MACOS="15.0"
AGENT_APP=0
DEV_CHANNEL=0                            # development builds use the real bundle ID (and its settings)
ICON_ICNS="Sources/BrewGUI/Resources/AppIcon.icns"
ICON_PNG="scripts/icon/AppIcon.png"      # dev.furian.sk's update-site.sh reads the icon from here
